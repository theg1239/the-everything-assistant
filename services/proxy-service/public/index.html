<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>the everything assistant</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #111216;
      color: #e5e7eb;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace, monospace;
      letter-spacing: 0.04em;
      font-size: 1.5rem;
      user-select: none;
      cursor: default;
    }
    .cryptic {
      text-transform: lowercase;
      opacity: 0.88;
      text-align: center;
      filter: blur(0.2px);
      letter-spacing: 0.08em;
      font-weight: 400;
      transition: opacity 0.5s;
    }
    .cryptic:hover {
      opacity: 1;
      filter: blur(0);
    }
  </style>
</head>
<body>
  <div class="cryptic">the everything assistant</div>
</body>
</html>
